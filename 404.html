<!doctype html>
<html lang="en">

  <title>Botond Tobai — under construction</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="Botond Tobai: website under construction.">
  <base href="/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="fonts/hanken-grotesk-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .soon-wrap { min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; padding: var(--pad); }
    /* Box width = displayed image width (set from the image ratio by the script below),
       so the text line above never sticks out past the image */
    .soon-box { width: min(56vh, 90vw); }
    .soon-text { margin: 0 0 0.6rem; }
    .soon-img { margin: 0; }
    .soon-img img { width: 100%; height: auto; background: var(--placeholder); }
    .soon-photo { display: block; }
    .soon-photo:hover img { opacity: 0.9; }
    .soon-insta { display: inline-flex; align-items: center; gap: 0.4em; margin-top: 0.6rem; }
    .soon-insta:hover { color: var(--ink-3); }
  </style>
</head>
<body>
<main class="soon-wrap">
  <div class="soon-box">
    <p class="soon-text">This website is under construction. Please check back soon.</p>
    <figure class="soon-img">
    <a class="soon-photo" href="https://www.instagram.com/tobai.botond/" target="_blank" rel="noopener" aria-label="Botond Tobai on Instagram">
    <img id="soon-img" alt="Work by Botond Tobai" sizes="(max-width: 760px) 90vw, 56vh">
    <noscript><img src="img/soon/01-m.webp" width="800" height="1000" alt="Work by Botond Tobai"></noscript>
    </a>
    <a class="soon-insta" href="https://www.instagram.com/tobai.botond/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/></svg><span>/tobai.botond</span></a>
    </figure>
  </div>
</main>
